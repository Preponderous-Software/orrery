name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json

jobs:
  test:
    name: Data, ephemeris tests, render smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build and llvmpipe dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libegl1 libegl-mesa0 libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev
          cmake --version

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"

      - name: Cache NAIF kernels
        uses: actions/cache@v4
        with:
          path: data/kernels
          key: naif-kernels-${{ hashFiles('data/kernels.sha256') }}

      # JPL data is fetched at build time, never committed (DATA_SOURCES.md).
      # The cache key is the query manifest (every JPL request tools/bodies.py
      # implies), so JPL is only asked again when a query changes or the
      # cache expires, not on every run.
      - name: Write the JPL query manifest
        run: |
          mkdir -p build
          uv run --python 3.12 tools/fetch_data.py plan > build/jpl-query-plan.json

      - name: Cache JPL API responses
        uses: actions/cache@v4
        with:
          path: data/raw
          key: jpl-raw-${{ hashFiles('build/jpl-query-plan.json') }}

      - name: Fetch data (NAIF kernels SHA-256 checked; JPL responses rate limited, cached, recorded in a manifest)
        run: uv run --python 3.12 tools/fetch_data.py all

      - name: Build the catalogue and test references from the fetched data
        run: |
          uv run --python 3.12 tools/build_catalog.py
          python3 -c "import json; m = json.load(open('data/catalog/manifest.json')); print('JPL data fetched', *m['fetched_utc_range'])"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORRERY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Tests (time, Kepler, scale, flight, ephemeris vs Horizons, headless render smoke test)
        run: ctest --test-dir build --output-on-failure

      - name: USD export opens in OpenUSD
        run: |
          build/orrery --date 2026-10-18 --export-usda build/check.usda
          uv run --python 3.12 --with usd-core==25.8 tests/check_usda.py build/check.usda

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-manifest
          path: data/catalog/manifest.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-frames
          path: build/smoke/
          if-no-files-found: ignore
