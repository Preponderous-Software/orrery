<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orrery</title>
<meta name="description" content="The solar system from NASA/JPL data, in the browser: planets, moons, comets, spacecraft and 12,000 asteroids, drawn with the Strata engine in WebGL 2.">
<style>
  :root { color-scheme: dark; --bg: #05070b; --bar: #10141b; --fg: #e8e6e1; --muted: #9aa0a8; --accent: #e8a24a;
          --line: #2a313c; --button: #1a2029; --button-on: #3a2f1c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; }
  /* SDL sizes the canvas in CSS pixels; the page decides instead, and the
     canvas follows it (Strata draws at that size times devicePixelRatio). */
  canvas#canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important;
                  outline: none; touch-action: none; cursor: grab; background: #000; }
  canvas#canvas.dragging { cursor: grabbing; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
            pointer-events: none; text-align: center; padding: 16px; }
  #status.error { color: #ff8a80; pointer-events: auto; }
  #status[hidden] { display: none; }
  /* The loading shell (web/strata-kit/strata-loader.js) in the page's colours. */
  :root { --sk-loader-bg: var(--bg); --sk-loader-fg: var(--fg); --sk-loader-accent: var(--accent); }
  nav { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px;
        padding-bottom: max(8px, env(safe-area-inset-bottom)); background: var(--bar); border-top: 1px solid var(--line); }
  nav .group { display: flex; gap: 4px; align-items: center; }
  button, select, input { font: inherit; color: var(--fg); background: var(--button); border: 1px solid var(--line);
                          border-radius: 6px; min-height: 36px; padding: 0 10px; }
  button { cursor: pointer; min-width: 36px; }
  button[aria-pressed="true"] { background: var(--button-on); border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select { max-width: 11em; }
  input[type="date"] { width: 10.5em; }
  nav a { color: var(--muted); margin-left: auto; white-space: nowrap; order: 99; }
  nav .break { display: none; }
  nav a:hover { color: var(--fg); }
  /* The ship's flight controls over the canvas: a thumb stick (left) that
     steers, a throttle lever (right) that stays where it is left, and a few
     buttons. Always on a touch screen; on a desktop, the Joystick toggle. */
  #flight { position: absolute; inset: 0; display: none; pointer-events: none; }
  #flight.on { display: block; }
  #flight > * { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stick { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: 24%; width: 116px; height: 116px;
           border-radius: 50%; border: 2px solid rgba(232, 162, 74, 0.55); background: rgba(16, 20, 27, 0.45); }
  #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
          border-radius: 50%; background: rgba(232, 162, 74, 0.8); pointer-events: none; }
  #lever { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: 24%; width: 52px; height: 150px;
           border-radius: 12px; border: 2px solid rgba(232, 162, 74, 0.55); background: rgba(16, 20, 27, 0.45); }
  /* The handle's centre runs from 13 px above the bottom (-25%) to 13 px below the top (100%). */
  #lever .zero { position: absolute; left: 6px; right: 6px; bottom: calc(13px + (100% - 26px) * 0.2);
                 border-top: 1px dashed var(--muted); }
  #handle { position: absolute; left: 3px; right: 3px; height: 26px; bottom: calc((100% - 26px) * 0.2);
            border-radius: 8px; background: rgba(232, 162, 74, 0.85); pointer-events: none; }
  #flight-buttons { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: calc(24% + 162px);
                    display: grid; grid-template-columns: repeat(3, auto); gap: 4px; }
  #flight-buttons button { min-width: 46px; min-height: 40px; padding: 0 6px; font-size: 12px;
                           background: rgba(26, 32, 41, 0.72); }
  #flight-buttons button.held { background: var(--button-on); border-color: var(--accent); }
  @media (pointer: coarse) { #joystick { display: none; } }
  /* The mission sheet: a panel at the top right, a bottom sheet on a phone. */
  #missions { position: absolute; top: 12px; right: 12px; width: min(420px, calc(100% - 24px));
              max-height: calc(100% - 24px); display: flex; flex-direction: column; background: rgba(16, 20, 27, 0.95);
              border: 1px solid var(--line); border-radius: 10px; z-index: 2; }
  #missions[hidden] { display: none; }
  #missions .head-row { display: flex; gap: 6px; align-items: center; padding: 8px 8px 8px 14px;
                        border-bottom: 1px solid var(--line); }
  #missions h2 { font-size: 16px; margin: 0; flex: 1 1 auto; }
  #mission-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
  #mission-list button { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 0 0 4px; }
  #mission-list .kind { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
                        margin-right: 8px; }
  #mission-list .brief, #mission-list .times { display: block; color: var(--muted); font-size: 13px; }
  #mission-list .times { font-variant-numeric: tabular-nums; }
  #rate { color: var(--muted); min-width: 6.5em; text-align: center; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    /* Two rows on a phone: the body picker, then time and view. */
    nav { gap: 4px; padding: 6px 8px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    button, select, input { min-height: 40px; padding: 0 8px; }
    button, select, input { padding: 0 7px; }
    nav .group:first-child { flex: 1 1 0; min-width: 0; }
    nav .group:first-child select { flex: 1 1 auto; max-width: none; min-width: 0; }
    nav a { order: 0; margin-left: 4px; font-size: 13px; }
    nav .break { display: block; flex-basis: 100%; height: 0; }
    .wide, #rate { display: none; }
    #missions { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 75%;
                border-radius: 12px 12px 0 0; border-bottom: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="canvas" tabindex="0" aria-label="The solar system. Drag to orbit, pinch or scroll to zoom."
          oncontextmenu="event.preventDefault()"></canvas>
  <div id="status" hidden></div>
  <div id="flight" aria-label="Ship controls">
    <div id="flight-buttons" role="group" aria-label="Ship buttons">
      <button data-key="75" id="drive-up" title="Next drive tier (PgUp, wheel up)">Drv +</button>
      <button data-key="78" id="drive-down" title="Previous drive tier (PgDn, wheel down)">Drv &minus;</button>
      <button data-key="23" id="autopilot" title="Autopilot to the target (T)" aria-pressed="false">Auto</button>
      <button data-hold="20" id="roll-left" title="Roll left (Q, hold)" aria-label="Roll left">&#8634;</button>
      <button data-hold="8" id="roll-right" title="Roll right (E, hold)" aria-label="Roll right">&#8635;</button>
      <button data-key="10" id="land" title="Land on the target (G)" aria-pressed="false">Land</button>
      <button data-key="29" id="stop" title="All stop (Z)">Stop</button>
      <button data-key="21" id="tow" title="Out of fuel: call a tow back to where you last landed (R)" hidden>Tow</button>
      <button data-key="6" id="view" title="Chase camera or cockpit (C)" aria-pressed="false">View</button>
      <button data-key="25" id="leave" title="Leave the ship (V)">Exit</button>
    </div>
    <div id="stick" role="slider" aria-label="Steer: pitch and yaw"><div id="knob"></div></div>
    <div id="lever" role="slider" aria-label="Throttle" aria-valuemin="-25" aria-valuemax="100" aria-valuenow="0">
      <div class="zero"></div><div id="handle"></div>
    </div>
  </div>
  <section id="missions" aria-labelledby="missions-title" hidden>
    <div class="head-row">
      <h2 id="missions-title">Missions</h2>
      <button id="abandon" title="Abandon the current mission (Backspace in the list)" hidden>Abandon</button>
      <button id="missions-close" aria-label="Close the mission list">&times;</button>
    </div>
    <ol id="mission-list"></ol>
  </section>
</div>
<nav aria-label="Orrery controls">
  <div class="group">
    <button id="prev" title="Previous body (Shift+Tab)" aria-label="Previous body">&lsaquo;</button>
    <select id="body" aria-label="Focus on a body"></select>
    <button id="next" title="Next body (Tab)" aria-label="Next body">&rsaquo;</button>
  </div>
  <div class="group">
    <button id="missions-button" title="Missions (I)" aria-pressed="false">Missions</button>
  </div>
  <a href="https://danielstephenson.dev/play">More games</a>
  <span class="break" aria-hidden="true"></span>
  <div class="group">
    <button id="slower" title="Slower (,)" aria-label="Slower">&laquo;</button>
    <button id="pause" title="Play / pause (Space)" aria-pressed="false">Pause</button>
    <button id="faster" title="Faster (.)" aria-label="Faster">&raquo;</button>
    <span id="rate" aria-live="polite"></span>
  </div>
  <div class="group">
    <button id="now" title="Now, at real time (N)">Now</button>
    <input id="date" class="wide" type="date" aria-label="Jump to a date" title="Jump to a date (J)">
  </div>
  <div class="group">
    <button id="mode" title="True or compressed (log) scale (M)" aria-pressed="false">Log scale</button>
    <button id="labels" title="Labels (L)" aria-pressed="true">Labels</button>
    <button id="ship" title="Fly a ship (V)" aria-pressed="false">Ship</button>
    <button id="joystick" title="On-screen joystick and throttle in the ship" aria-pressed="false" hidden>Joystick</button>
    <button id="orbits" class="wide" title="Orbits (O)" aria-pressed="true">Orbits</button>
    <button id="help" class="wide" title="Keyboard help (H)" aria-pressed="false">Keys</button>
  </div>
</nav>
<!-- ?bench: a scripted frame-rate run (web/bench.js); it must load before the engine. -->
<script src="bench.js"></script>
<!-- emcc's script tag, kept inert: web/strata-boot.js starts it behind the
     loading shell. data-bytes is the download's size, stamped by the build. -->
<template id="strata-glue" data-bytes="0">{{{ SCRIPT }}}</template>
<!-- The loading shell, vendored from Strata, and its bridge to this build; the
     build puts both inline (web/strata_page.cmake). -->
<script src="strata-kit/strata-loader.js"></script>
<script src="strata-boot.js"></script>
<script>
  // SDL3 scancodes (USB HID usage ids), as orrery_key takes them.
  const KEY = { tab: 43, space: 44, comma: 54, period: 55, n: 17, m: 16, l: 15, o: 18, h: 11, v: 25,
                pageUp: 75, pageDown: 78 };
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  function fail(text) { status.textContent = text; status.className = 'error'; status.hidden = false; }
  var Module = {
    canvas: canvas,
    // Keys reach the orrery only while the canvas has focus, so typing in the
    // date box does not also fly the camera.
    preRun: [() => { ENV.SDL_EMSCRIPTEN_KEYBOARD_ELEMENT = '#canvas'; }],
    print: (text) => console.log(text),
    printErr: (text) => console.warn(text),
    onAbort: (what) => fail('The orrery stopped: ' + what),
  };
  window.addEventListener('error', (e) => fail('Error: ' + e.message));

  let api = null;
  function ready() {
    api = {
      resize: Module.cwrap('orrery_resize', null, ['number', 'number']),
      orbit: Module.cwrap('orrery_orbit', null, ['number', 'number']),
      zoom: Module.cwrap('orrery_zoom', null, ['number']),
      key: Module.cwrap('orrery_key', null, ['number', 'number']),
      focus: Module.cwrap('orrery_focus', null, ['number']),
      setDate: Module.cwrap('orrery_set_date', 'number', ['string']),
      count: Module.cwrap('orrery_body_count', 'number', []),
      name: Module.cwrap('orrery_body_name', 'string', ['number']),
      kind: Module.cwrap('orrery_body_kind', 'string', ['number']),
      status: () => JSON.parse(Module.ccall('orrery_status', 'string', [], [])),
      hold: Module.cwrap('orrery_hold', null, ['number']),
      uiScale: Module.cwrap('orrery_ui_scale', null, ['number']),
      keyHints: Module.cwrap('orrery_key_hints', null, ['number']),
      holdKey: Module.cwrap('orrery_hold_key', null, ['number', 'number']),
      stick: Module.cwrap('orrery_stick', null, ['number', 'number']),
      throttle: Module.cwrap('orrery_throttle', null, ['number']),
      missionCount: Module.cwrap('orrery_mission_count', 'number', []),
      missionJson: Module.cwrap('orrery_mission_json', 'string', ['number']),
      startMission: Module.cwrap('orrery_start_mission', 'number', ['number']),
      abandonMission: Module.cwrap('orrery_abandon_mission', null, []),
      records: Module.cwrap('orrery_records', 'string', []),
      loadRecords: Module.cwrap('orrery_load_records', null, ['string']),
    };
    window.orrery = api;  // for the smoke test (web/smoke/smoke.mjs)
    const select = document.getElementById('body');
    const groups = {};
    for (let i = 0; i < api.count(); i++) {
      const kind = api.kind(i);
      const label = { star: 'Sun', planet: 'Planets', 'dwarf planet': 'Dwarf planets', moon: 'Moons',
                      comet: 'Comets', spacecraft: 'Spacecraft' }[kind] || kind;
      if (!groups[label]) { groups[label] = document.createElement('optgroup'); groups[label].label = label;
                            select.appendChild(groups[label]); }
      const option = document.createElement('option');
      option.value = i; option.textContent = api.name(i);
      groups[label].appendChild(option);
    }
    try { const r = localStorage.getItem('orrery.records'); if (r) api.loadRecords(r); } catch (e) {}
    const s = api.status();
    const date = document.getElementById('date');
    date.min = s.firstDate.slice(0, 10); date.max = s.lastDate.slice(0, 10);
    fit();
    StrataBoot.ready();
    canvas.focus({ preventScroll: true });
    window.orreryReady = true;
    setInterval(sync, 250);
    sync();
    if (window.StrataBench && StrataBench.requested) bench();
  }

  // ?bench: the whole solar system on 2026-01-01 with time paused, focused on the Sun, the
  // camera turning once around it, closing in and back out. orrery_orbit and orrery_zoom are
  // relative, so each frame moves the camera by the path's step since the last; the path
  // depends only on the time into the run, so runs on different devices are comparable.
  function bench() {
    const turn = 360 / 0.3;  // orrery_orbit's pixels for a full turn
    const dist = (u) => 1 - 0.35 * Math.sin(Math.PI * u);
    let at = 0;
    StrataBench.run({
      name: 'orrery', scene: 'the Sun on 2026-01-01, time paused, one orbit', canvas,
      setup: () => {
        api.setDate('2026-01-01');
        api.focus(0);
        if (!api.status().paused) press(KEY.space);
      },
      path: (u) => { api.orbit(turn * (u - at), 0); api.zoom(dist(u) / dist(at)); at = u; },
    });
  }
  // The C++ side starts its loop at the end of main(); the exports exist from then on.
  Module.onRuntimeInitialized = () => { const wait = () => (Module._orrery_body_count() > 0 ? ready() : setTimeout(wait, 30)); wait(); };

  // The loading shell: the trailer's first frame behind real progress over the
  // engine and its JPL data, and the trailer itself, with the reason, if the
  // live view can't run here. The media are the game's /play trailer.
  StrataBoot.start({
    wasm: 'index.wasm',
    title: 'the solar system',
    poster: 'https://danielstephenson.dev/trailers/orrery.jpg',
    posterAlt: 'The orrery: planets and their orbits around the Sun',
    trailer: { webm: 'https://danielstephenson.dev/trailers/orrery.webm',
               mp4: 'https://danielstephenson.dev/trailers/orrery.mp4' },
    trailerLabel: 'A recorded clip of the orrery',
    fallback: { href: 'https://danielstephenson.dev/play', text: 'More games' },
    canvas,
  }).catch(() => {});  // the loading shell already shows why

  function fit() {
    if (!api) return;
    const r = canvas.getBoundingClientRect();
    // Text at the page's pixel density, a little smaller on a narrow screen so
    // the HUD's lines fit (they are laid out for at least 440 CSS pixels).
    api.uiScale((window.devicePixelRatio || 1) * Math.min(1, r.width / 440));
    api.keyHints(!matchMedia('(pointer: coarse)').matches);
    api.resize(Math.max(1, Math.round(r.width)), Math.max(1, Math.round(r.height)));
  }
  new ResizeObserver(fit).observe(document.querySelector('.stage'));

  // Toolbar state follows the orrery (keys change it too).
  let flying = false;
  function sync() {
    const s = api.status();
    flying = s.ship;
    document.getElementById('ship').setAttribute('aria-pressed', String(s.ship));
    document.getElementById('joystick').hidden = !s.ship;
    document.getElementById('joystick').setAttribute('aria-pressed', String(joystickOn));
    document.getElementById('flight').classList.toggle('on', s.ship && (touchScreen || joystickOn));
    if (!s.ship) releaseAll();
    if (!leverHeld) showThrottle(s.throttle);
    document.getElementById('autopilot').setAttribute('aria-pressed', String(s.autopilot && !s.landing));
    document.getElementById('land').setAttribute('aria-pressed', String(!!s.landing));
    document.getElementById('tow').hidden = !(s.ship && s.fuel <= 0);
    document.getElementById('view').setAttribute('aria-pressed', String(s.cockpit));
    const select = document.getElementById('body');
    if (document.activeElement !== select && String(select.value) !== String(s.focus)) select.value = s.focus;
    const pause = document.getElementById('pause');
    pause.textContent = s.paused ? 'Play' : 'Pause';
    pause.setAttribute('aria-pressed', String(s.paused));
    document.getElementById('rate').textContent = s.paused ? '' : s.rate;
    document.getElementById('mode').setAttribute('aria-pressed', String(s.mode === 'compressed'));
    for (const id of ['labels', 'orbits', 'help']) document.getElementById(id).setAttribute('aria-pressed', String(s[id]));
    document.getElementById('abandon').hidden = !(s.mission && !s.missionComplete);
    if (s.recordsVersion !== savedRecords) {  // a new best: keep it in this browser
      savedRecords = s.recordsVersion;
      try { localStorage.setItem('orrery.records', api.records()); } catch (e) {}
      if (!sheet.hidden) listMissions();
    }
  }
  function press(code, shift) { if (api) { api.key(code, shift ? 1 : 0); sync(); } }
  document.getElementById('prev').onclick = () => press(KEY.tab, true);
  document.getElementById('next').onclick = () => press(KEY.tab, false);
  document.getElementById('body').onchange = (e) => { api.focus(Number(e.target.value)); sync(); };
  document.getElementById('slower').onclick = () => press(KEY.comma);
  document.getElementById('faster').onclick = () => press(KEY.period);
  document.getElementById('pause').onclick = () => press(KEY.space);
  document.getElementById('now').onclick = () => press(KEY.n);
  document.getElementById('mode').onclick = () => press(KEY.m);
  document.getElementById('labels').onclick = () => press(KEY.l);
  document.getElementById('orbits').onclick = () => press(KEY.o);
  document.getElementById('help').onclick = () => press(KEY.h);
  document.getElementById('date').onchange = (e) => { if (api && e.target.value) api.setDate(e.target.value); };
  document.getElementById('ship').onclick = () => press(KEY.v);

  // Missions: the sheet lists them with this browser's best times; picking one
  // starts it in the ship. The best times are kept in localStorage.
  const sheet = document.getElementById('missions');
  const missionsButton = document.getElementById('missions-button');
  let savedRecords = 0;
  function clock(seconds) {
    const t = Math.round(Math.max(seconds, 0) * 10), two = (n) => String(n).padStart(2, '0');
    if (t >= 36000) return `${Math.floor(t / 36000)}:${two(Math.floor(t / 600) % 60)}:${two(Math.floor(t / 10) % 60)}`;
    return `${Math.floor(t / 600)}:${two(Math.floor(t / 10) % 60)}.${t % 10}`;
  }
  function listMissions() {
    const list = document.getElementById('mission-list');
    list.textContent = '';
    for (let i = 0; i < api.missionCount(); i++) {
      const m = JSON.parse(api.missionJson(i));
      const item = document.createElement('li'), b = document.createElement('button');
      b.dataset.id = m.id;
      const kind = document.createElement('span'), title = document.createElement('strong');
      const brief = document.createElement('span'), times = document.createElement('span');
      kind.className = 'kind'; kind.textContent = m.kind;
      title.textContent = m.title;
      brief.className = 'brief'; brief.textContent = m.brief;
      times.className = 'times';
      times.textContent = [m.best > 0 ? 'best ' + clock(m.best) : 'not flown yet', m.par > 0 ? 'par ' + clock(m.par) : '']
        .filter(Boolean).join(' \u00b7 ');
      b.append(kind, title, brief, times);
      b.onclick = () => { api.startMission(i); showMissions(false); canvas.focus({ preventScroll: true }); sync(); };
      item.appendChild(b);
      list.appendChild(item);
    }
  }
  function showMissions(on) {
    if (on && api) listMissions();
    sheet.hidden = !on;
    missionsButton.setAttribute('aria-pressed', String(on));
  }
  missionsButton.onclick = () => showMissions(sheet.hidden);
  document.getElementById('missions-close').onclick = () => { showMissions(false); canvas.focus({ preventScroll: true }); };
  document.getElementById('abandon').onclick = () => { if (api) { api.abandonMission(); sync(); } };
  sheet.addEventListener('keydown', (e) => { if (e.key === 'Escape') showMissions(false); });

  // The ship's controls. Buttons press a key once; the roll buttons hold
  // theirs down while touched. On a desktop they show only with the toggle,
  // remembered in this browser.
  const touchScreen = matchMedia('(pointer: coarse)').matches;
  let joystickOn = false;
  try { joystickOn = localStorage.getItem('orrery.joystick') === '1'; } catch (e) {}
  document.getElementById('joystick').onclick = () => {
    joystickOn = !joystickOn;
    try { localStorage.setItem('orrery.joystick', joystickOn ? '1' : '0'); } catch (e) {}
    sync();
  };
  const held = new Map();  // pointerId -> button
  function release(id) {
    const b = held.get(id);
    if (!b) return;
    held.delete(id);
    b.classList.remove('held');
    if (api) api.holdKey(Number(b.dataset.hold), 0);
  }
  function releaseAll() {
    for (const id of [...held.keys()]) release(id);
    if (api) api.stick(0, 0);
    knob.style.transform = '';
  }
  for (const b of document.querySelectorAll('#flight-buttons button')) {
    if (b.dataset.key) {
      b.onclick = () => { press(Number(b.dataset.key)); canvas.focus({ preventScroll: true }); };
      continue;
    }
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!api) return;
      b.setPointerCapture(e.pointerId);
      held.set(e.pointerId, b);
      b.classList.add('held');
      api.holdKey(Number(b.dataset.hold), 1);
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(type, (e) => release(e.pointerId));
  }
  window.addEventListener('blur', releaseAll);

  // The stick: steers while held off centre, springs back when let go.
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let stickId = null;
  function moveStick(e) {
    const r = stick.getBoundingClientRect();
    const reach = r.width / 2 - 25;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > reach) { dx *= reach / d; dy *= reach / d; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    if (api) api.stick(dx / reach, -dy / reach);
  }
  stick.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    stick.setPointerCapture(e.pointerId);
    stickId = e.pointerId;
    moveStick(e);
  });
  stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) moveStick(e); });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    stick.addEventListener(type, (e) => {
      if (e.pointerId !== stickId) return;
      stickId = null;
      knob.style.transform = '';
      if (api) api.stick(0, 0);
    });
  }

  // The throttle lever: from reverse (-25%) at the bottom to full at the top,
  // with a detent at zero; it stays where it is let go.
  const lever = document.getElementById('lever'), handle = document.getElementById('handle');
  let leverHeld = null;
  function showThrottle(t) {
    handle.style.bottom = `calc((100% - 26px) * ${0.2 + 0.8 * t})`;
    lever.setAttribute('aria-valuenow', String(Math.round(t * 100)));
  }
  function moveLever(e) {
    const r = lever.getBoundingClientRect();
    const up = Math.min(Math.max((r.bottom - 13 - e.clientY) / (r.height - 26), 0), 1);
    let t = (up - 0.2) / 0.8;
    if (Math.abs(t) < 0.05) t = 0;
    showThrottle(t);
    if (api) api.throttle(t);
  }
  lever.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    lever.setPointerCapture(e.pointerId);
    leverHeld = e.pointerId;
    moveLever(e);
  });
  lever.addEventListener('pointermove', (e) => { if (e.pointerId === leverHeld) moveLever(e); });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    lever.addEventListener(type, (e) => { if (e.pointerId === leverHeld) leverHeld = null; });
  }

  // Pointers: one finger or the mouse orbits, two fingers pinch to zoom, the
  // wheel zooms. All in CSS pixels, as the desktop build's mouse is.
  const pointers = new Map();
  let pinch = 0;
  function spread() {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  canvas.addEventListener('pointerdown', (e) => {
    canvas.focus({ preventScroll: true });
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('dragging');
    if (pointers.size === 2) pinch = spread();
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p || !api) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) {
      api.orbit(dx, dy);
    } else if (pointers.size === 2) {
      const d = spread();
      if (pinch > 0 && d > 0) api.zoom(pinch / d);
      pinch = d;
    }
  });
  function lift(e) {
    pointers.delete(e.pointerId);
    pinch = pointers.size === 2 ? spread() : 0;
    if (pointers.size === 0) canvas.classList.remove('dragging');
  }
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  // In the ship the wheel steps the drive instead: one tier per notch, and a
  // trackpad's stream of small deltas adds up to a notch first.
  let wheelSum = 0, wheelAt = 0;
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (!api) return;
    const lines = e.deltaMode === 1 ? e.deltaY : e.deltaY / 100;
    if (!flying) { api.zoom(Math.pow(0.85, -lines)); return; }
    wheelSum += lines;
    if (Math.abs(wheelSum) >= 1 && performance.now() - wheelAt > 150) {
      press(wheelSum < 0 ? KEY.pageUp : KEY.pageDown);
      wheelSum = 0;
      wheelAt = performance.now();
    }
  }, { passive: false });
</script>
</body>
</html>
